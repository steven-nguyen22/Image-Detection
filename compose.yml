version: "3"
services:
  react-app:
    image: stevennguyen22/hoopvision:frontend
    stdin_open: true
    ports:
      - "5173:5173"
    networks:
      - myapp
  api-server:
    image: stevennguyen22/hoopvision:backend
    ports:
      - "8080:8080"
    networks:
      - myapp
networks:
  myapp:
    driver: bridge
